name: Nightly NSE price fetch (Yahoo Finance)

on:
  schedule:
    # 16:00 IST = 10:30 UTC — fast run, ~30 min after market close. Yahoo
    # doesn't always have the final settled price ready this early, so...
    - cron: "30 10 * * *"
    # ...23:00 IST = 17:30 UTC — safety-net re-run. Safe to run twice a day:
    # the script just overwrites with whatever's latest, so this catches and
    # self-corrects anything the 4pm run got before Yahoo had finalized it.
    - cron: "30 17 * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Without this, Python buffers stdout and the log prints out of order
      # (the traceback lands above the messages that led up to it).
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Render the dashboard headlessly against fixtures. Catches broken
      # column references and bad maths across every tab without a browser.
      - name: Render dashboard (headless)
        run: |
          python tests/render_dashboard.py
          FAKE_ST_AGGRESSIVE=1 python tests/render_dashboard.py

      # Fail in seconds, not after a ten-minute download, if the database
      # is unreachable or the DATABASE_URL secret is missing.
      - name: Check database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/check_db.py

      # Data now goes straight into Postgres — nothing is committed back to the
      # repo, so the dashboard picks up fresh data without a redeploy (which
      # used to restart the app and wipe watchlists twice a day).
      # Run every query the dashboard issues against the real database. The
      # headless render stubs SQL, so this is what catches a query that is
      # valid Python and invalid Postgres.
      - name: Smoke-test dashboard queries
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/smoke_test_queries.py

      - name: Fetch prices from Yahoo Finance
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/fetch_yahoo_prices.py

      - name: Fetch index levels from Yahoo Finance
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/fetch_indices.py

      # WhatsApp alert for big movers in the personal watchlist. continue-on-error
      # keeps a messaging hiccup from marking the data collection as failed —
      # the prices are already safely written by this point.
      - name: WhatsApp alert for watchlist movers
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          ALERT_THRESHOLD_PCT: "3"
        run: python scripts/send_watchlist_alert.py
