name: Nightly NSE price fetch (Yahoo Finance)

on:
  schedule:
    # 16:00 IST = 10:30 UTC — fast run, ~30 min after market close. Yahoo
    # doesn't always have the final settled price ready this early, so...
    - cron: "30 10 * * *"
    # ...23:00 IST = 17:30 UTC — safety-net re-run. Safe to run twice a day:
    # the script just overwrites with whatever's latest, so this catches and
    # self-corrects anything the 4pm run got before Yahoo had finalized it.
    - cron: "30 17 * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices from Yahoo Finance
        run: python scripts/fetch_yahoo_prices.py

      - name: Fetch index levels from Yahoo Finance
        run: python scripts/fetch_indices.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit (market holiday/weekend or already up to date)."
          else
            git commit -m "Update NSE stock prices $(date -u +'%Y-%m-%d')"
            git push
          fi
