name: Monthly symbol master + shares outstanding refresh

on:
  schedule:
    # 1st of each month, 20:00 UTC — catches new NSE listings/delistings and
    # share-count changes (buybacks, splits, new issues). This is the only
    # workflow that talks to NSE; the nightly price fetch uses Yahoo Finance
    # exclusively.
    - cron: "0 20 1 * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Hoisted to job level so the Advisorkhoj step's `if` can test it: the
      # `secrets` context is not available in `if`, only `env` and friends.
      ADVISORKHOJ_KEY: ${{ secrets.ADVISORKHOJ_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # symbol_master.csv stays a file (small, changes rarely, and the price
      # fetch reads it to know which symbols to pull), so this one still
      # commits — but only once a month, not twice a day.
      - name: Refresh symbol master from NSE
        run: python scripts/refresh_symbol_master.py

      # Sectors come from NSE's own index constituent lists (free, no auth, no
      # rate limit) rather than Yahoo's per-symbol .info endpoint, which rate
      # limits hard at this volume.
      - name: Refresh sector classification from NSE
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/fetch_sectors.py

      # Fund houses publish portfolios monthly, so this runs on the same
      # cadence. Skipped when ADVISORKHOJ_KEY isn't set, so a fork or a repo
      # without the key still gets a green run.
      - name: Refresh mutual fund holdings from Advisorkhoj
        if: env.ADVISORKHOJ_KEY != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # One month per run, not six. The API rate-limits at bulk volume,
        # and the fetch is resumable — months already stored are skipped — so
        # history fills in over successive monthly runs instead of one long
        # burst that gets throttled.
        run: python scripts/fetch_mf_holdings.py --months 1

      - name: Refresh shares outstanding from Yahoo Finance
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/fetch_shares_outstanding.py

      - name: Commit symbol master if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/symbol_master.csv
          if git diff --cached --quiet; then
            echo "No changes to symbol master."
          else
            git commit -m "Monthly refresh: symbol master $(date -u +'%Y-%m-%d')"
            git push
          fi
